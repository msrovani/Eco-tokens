name: eco-verify-v3
on:
  push:
    branches: [main]
  pull_request:

jobs:
  self-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: self-test
        run: |
          chmod +x install.sh
          python3 -m py_compile templates/mcp-server.py
          bash -n install.sh
          ./install.sh --self-test
