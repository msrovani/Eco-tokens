name: eco-verify
on:
  push:
    branches: [main]
  pull_request:

jobs:
  self-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: install.sh --self-test
        run: |
          chmod +x install.sh
          ./install.sh --self-test
