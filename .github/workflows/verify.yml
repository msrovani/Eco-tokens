name: eco-verify-0.3
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: full suite
        run: |
          chmod +x install.sh scripts/run-tests.sh tests/test_install_integration.sh
          bash scripts/run-tests.sh
